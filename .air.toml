root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/weeklynet ./cmd/server"
bin = "./tmp/weeklynet"
full_bin = ""
include_ext = ["go", "html", "css", "js"]
exclude_dir = ["tmp", "bin", "data", "backups", ".git"]
exclude_file = []
exclude_regex = ["_test\\.go"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[screen]
clear_on_rebuild = false
